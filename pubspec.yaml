name: asdas
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI пакеты
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  shimmer: ^3.0.0

  # Firebase пакеты
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.3

  # Image Picker
  image_picker: ^1.0.4

  # Уведомления (без лишних плагинов часовых поясов)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true